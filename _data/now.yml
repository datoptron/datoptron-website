- title: EDP
  description: Since October 2026, Datoptron has been part of the consortium, alongside Telekom and PPMI, that delivers services for the European Data Portal under a 54-month contract with the Publications Office of the European Union. Datoptron is responsible for the portal’s data harvesting and other core data components.
  link: https://data.europa.eu/en

- title: CULTUR.ACT
  description: Horizon Europe-funded project (2026-2029) designed to bring the European Collaborative Cloud for Cultural Heritage (ECCCH) to life through real-world testing and adoption.
  link: https://www.digitalheritage.ee/research-projects/cultur-act

- title: Env Legislation
  description: Datoptron participates as a subcontractor in a project that supports the European Commission with a new study on the “Stress Test Focusing on the Digital Dimension of European Environmental Legislation.” It is responsible for aspects related to semantic modelling, RDF automation and machine-readable legislation outputs.
  link: https://technopolis-group.com/new/technopolis-group-supports-european-commission-study-on-the-digital-dimension-of-environmental-legislation/

- title: CORDIS
  description: Improving and enriching the data of the Community Research and Development Information Service (CORDIS) of the Europena Commission using Linked Data and AI technologies. Datoptron is currently responsible for tasks related to the reconciliation of organizations that have participated in EU research projects over the last four decades.
  link: https://cordis.europa.eu/

- title: DS4CH (2026-2027)
  description: Data Space for Cultural Heritage DS4CH - deployment of the common European data space (2026-2027). Datoptron is responsible for supporting data management tasks and the adoption of AI technologies.
  link: https://pro.europeana.eu/page/data-space-deployment
